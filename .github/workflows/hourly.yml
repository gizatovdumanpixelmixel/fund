name: Команды и монитор

on:
  schedule:
    - cron: "37 * * * *"          # раз в час: команды из Telegram + монитор раз в 2 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Almaty
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_PAID: ${{ vars.LLM_PAID }}
      LLM_MONTHLY_BUDGET_USD: ${{ vars.LLM_MONTHLY_BUDGET_USD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установка
        run: pip install -r requirements.txt
      - name: Команды и монитор
        run: python bot.py cycle
      - name: Сохранить данные
        if: always()
        run: bash .github/scripts/save_state.sh "Цикл №${{ github.run_number }}"
