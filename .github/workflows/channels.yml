name: Проверка каналов

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Almaty
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверка каналов-кандидатов
        run: python news.py check-channels channel_candidates.txt
      - name: Сохранить результат
        run: |
          git config user.name "fund-bot"
          git config user.email "fund-bot@users.noreply.github.com"
          git add channel_check.json telegram_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Проверка каналов" && git pull --rebase -q && git push -q)
