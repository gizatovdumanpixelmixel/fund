name: Лаборатория стратегий

on:
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько дней истории (730 = 2 года)"
        default: "730"

permissions:
  contents: write

concurrency:
  group: fund-state
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Almaty
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установка
        run: pip install -r requirements.txt
      - name: Бэктест
        run: python lab.py --days "${{ inputs.days || '730' }}"
      - name: Сообщить об ошибке
        if: failure()
        run: python -c "import notify; notify.send('❌ Лаборатория завершилась с ошибкой. Подробности — GitHub → Actions → «Лаборатория стратегий».')"
      - name: Сохранить отчёт
        if: always()
        run: bash .github/scripts/save_state.sh "Лаборатория №${{ github.run_number }}"
